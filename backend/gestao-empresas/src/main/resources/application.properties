spring.config.import=optional:file:.env[.properties]
spring.application.name=gestao-empresas
spring.profiles.active=shared

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.flyway=DEBUG
spring.flyway.validate-migration-naming=true

spring.security.user.name=${SPRING_SECURITY_USER_NAME}
spring.security.user.password=${SPRING_SECURITY_PASSWORD}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

app.mail.from=${MAIL_FROM}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend.url=${FRONTEND_URL}

app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.senha=${APP_ADMIN_SENHA:}

app.convites.expor-token=${CONVITES_EXPOR_TOKEN:false}

app.jwt.secret=${JWT_SECRET}
app.jwt.validade-minutos=${JWT_VALIDADE_MINUTOS:60}

app.storage.tipo=${STORAGE_TIPO:local}
app.storage.dir=${STORAGE_DIR:./storage}
app.storage.s3.endpoint=${STORAGE_ENDPOINT:}
app.storage.s3.region=${STORAGE_REGION:}
app.storage.s3.access-key=${STORAGE_ACCESS_KEY:}
app.storage.s3.secret-key=${STORAGE_SECRET_KEY:}
app.storage.s3.bucket=${STORAGE_BUCKET:}